---
# Monitoring Stack: Prometheus, Grafana, Loki, Uptime Kuma

- name: Install base packages
  apt:
    name:
      - docker.io
      - docker-compose-plugin
      - curl
      - ca-certificates
      - ufw
    state: present
    update_cache: yes

- name: Enable Docker
  systemd:
    name: docker
    state: started
    enabled: yes

# UFW Firewall
- name: Configure UFW defaults
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }

- name: Allow SSH from LAN
  ufw:
    rule: allow
    port: '22'
    proto: tcp
    src: "{{ lan_subnet }}"

- name: Allow monitoring ports from Edge VMs
  ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: tcp
    src: "{{ item.src }}"
  loop:
    - { port: '3000', src: "{{ groups['edge'] | map('extract', hostvars, 'ansible_host') | join(',') }}" }  # Grafana
    - { port: '3001', src: "{{ groups['edge'] | map('extract', hostvars, 'ansible_host') | join(',') }}" }  # Uptime Kuma
    - { port: '9090', src: "{{ lan_subnet }}" }  # Prometheus (LAN only)
    - { port: '3100', src: "{{ lan_subnet }}" }  # Loki (LAN only)
    - { port: '9100', src: "{{ lan_subnet }}" }  # Node Exporter

- name: Enable UFW
  ufw:
    state: enabled

# Create directories
- name: Create monitoring directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/monitoring
    - /opt/monitoring/prometheus
    - /opt/monitoring/grafana
    - /opt/monitoring/loki
    - /opt/monitoring/promtail
    - /opt/monitoring/alertmanager
    - /opt/monitoring/data
    - /opt/monitoring/data/prometheus
    - /opt/monitoring/data/grafana
    - /opt/monitoring/data/loki

# Prometheus Configuration
- name: Deploy Prometheus configuration
  template:
    src: prometheus.yml.j2
    dest: /opt/monitoring/prometheus/prometheus.yml
    mode: '0644'
  notify: restart prometheus

- name: Deploy alert rules
  template:
    src: alert-rules.yml.j2
    dest: /opt/monitoring/prometheus/alert-rules.yml
    mode: '0644'
  notify: restart prometheus

# Loki Configuration
- name: Deploy Loki configuration
  template:
    src: loki-config.yml.j2
    dest: /opt/monitoring/loki/loki-config.yml
    mode: '0644'
  notify: restart loki

# Promtail Configuration
- name: Deploy Promtail configuration
  template:
    src: promtail-config.yml.j2
    dest: /opt/monitoring/promtail/promtail-config.yml
    mode: '0644'
  notify: restart promtail

# Grafana Provisioning
- name: Create Grafana provisioning directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/monitoring/grafana/provisioning
    - /opt/monitoring/grafana/provisioning/datasources
    - /opt/monitoring/grafana/provisioning/dashboards
    - /opt/monitoring/grafana/dashboards

- name: Deploy Grafana datasources
  template:
    src: grafana-datasources.yml.j2
    dest: /opt/monitoring/grafana/provisioning/datasources/default.yml
    mode: '0644'

- name: Deploy Grafana dashboard provisioning
  template:
    src: grafana-dashboards.yml.j2
    dest: /opt/monitoring/grafana/provisioning/dashboards/default.yml
    mode: '0644'

- name: Deploy default dashboards
  copy:
    src: "{{ item }}"
    dest: /opt/monitoring/grafana/dashboards/
    mode: '0644'
  loop:
    - node-exporter-dashboard.json
    - traefik-dashboard.json
    - docker-dashboard.json
  ignore_errors: yes  # Dashboards are optional

# Docker Compose Stack
- name: Deploy monitoring docker-compose
  template:
    src: monitoring-compose.yml.j2
    dest: /opt/monitoring/docker-compose.yml
    mode: '0644'
  notify: restart monitoring

- name: Start monitoring stack
  command: docker compose up -d
  args:
    chdir: /opt/monitoring
  register: monitoring_up
  changed_when: "'Creating' in monitoring_up.stdout or 'Recreating' in monitoring_up.stdout or 'Starting' in monitoring_up.stdout"
  tags: monitoring

# Uptime Kuma (separate compose for isolation)
- name: Create Uptime Kuma directory
  file:
    path: /opt/uptime-kuma
    state: directory
    mode: '0755'

- name: Deploy Uptime Kuma compose
  template:
    src: uptime-kuma-compose.yml.j2
    dest: /opt/uptime-kuma/docker-compose.yml
    mode: '0644'

- name: Start Uptime Kuma
  command: docker compose up -d
  args:
    chdir: /opt/uptime-kuma
  register: uptime_up
  changed_when: "'Creating' in uptime_up.stdout or 'Recreating' in uptime_up.stdout or 'Starting' in uptime_up.stdout"
  tags: uptime-kuma

# Node Exporter on monitoring host
- name: Install Node Exporter
  docker_container:
    name: node-exporter
    image: prom/node-exporter:latest
    state: started
    restart_policy: unless-stopped
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'

# Health check endpoint
- name: Create health check script
  copy:
    content: |
      #!/bin/bash
      curl -s http://localhost:9090/-/healthy && \
      curl -s http://localhost:3000/api/health && \
      curl -s http://localhost:3100/ready
    dest: /usr/local/bin/monitoring-health
    mode: '0755'
